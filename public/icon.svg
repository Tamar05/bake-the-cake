<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bake the Cake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fab"/>
      <stop offset="1" stop-color="#ff6f91"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="102" fill="url(#bg)"/>
  <!-- plate -->
  <ellipse cx="256" cy="376" rx="133" ry="28" fill="#ffffff"/>
  <!-- cake body -->
  <rect x="159" y="266" width="194" height="102" rx="15" fill="#ffe3b8"/>
  <!-- frosting cap -->
  <rect x="151" y="227" width="210" height="43" rx="18" fill="#fffdf9"/>
  <!-- frosting drips -->
  <g fill="#fffdf9">
    <circle cx="172" cy="271" r="17"/>
    <circle cx="205" cy="271" r="17"/>
    <circle cx="238" cy="271" r="17"/>
    <circle cx="271" cy="271" r="17"/>
    <circle cx="304" cy="271" r="17"/>
    <circle cx="338" cy="271" r="17"/>
  </g>
  <!-- sprinkles -->
  <circle cx="205" cy="248" r="5" fill="#ff6f91"/>
  <circle cx="241" cy="256" r="5" fill="#7ac6a4"/>
  <circle cx="282" cy="248" r="5" fill="#ffcf5c"/>
  <circle cx="307" cy="256" r="5" fill="#ff6f91"/>
  <!-- candle -->
  <rect x="248" y="151" width="16" height="82" rx="8" fill="#b9a3e3"/>
  <!-- flame -->
  <ellipse cx="256" cy="136" rx="14" ry="23" fill="#ffcf5c"/>
  <ellipse cx="256" cy="141" rx="6" ry="13" fill="#fff0b8"/>
</svg>
